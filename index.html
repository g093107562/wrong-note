<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>錯題不放過小工具｜拍考卷列題目、重寫過關</title>
  <style>
    /* =========================================================
       樣式區（換顏色、圓角、按鈕、卡片間距，直接改這裡最快）
       ========================================================= */
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --ai: #7c3aed;
      --ai-hover: #6d28d9;
      --ai-soft: #f5f3ff;
      --ai-border: #ddd6fe;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --danger-border: #fecaca;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --success-border: #bbf7d0;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 18px;
      --shadow: 0 6px 24px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
