<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>錯題重練小工具｜多張拍照與批次錯題記憶</title>
  <style>
    /* ====== 樣式調整區（顏色、圓角、卡片、按鈕都在這裡改） ====== */
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary.active {
      background: var(--primary);
      color: #fff;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger-soft {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .field-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    select,
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      background: #fff;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 600px) {
      .row-2,
      .row-3 {
        grid-template-columns: 1fr;
      }
    }

    .photo-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .photo-tip {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      word-break: break-all;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .photo-thumb-card {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      background: #f8fafc;
    }

    .photo-thumb-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .remove-photo-btn {
      margin-top: 6px;
      width: 100%;
      padding: 5px 8px;
      font-size: 0.82rem;
      border-radius: 8px;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .choice-btn {
      padding: 12px 8px;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      font-size: 1rem;
    }

    .feedback {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      display: none;
    }

    .feedback.wrong {
      display: block;
      background: var(--danger-bg);
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .feedback.right {
      display: block;
      background: var(--success-bg);
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .mistake-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      background: #fff;
    }

    .mistake-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #fee2e2;
      color: #b91c1c;
      margin-right: 6px;
    }

    .badge.ok {
      background: #dcfce7;
      color: #15803d;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    .footer-note {
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="header-top">
        <div>
          <h1>錯題重練小工具</h1>
          <p class="subtitle">支援一次多張照片、一次批次新增多題，考前只練錯題</p>
        </div>
        <select id="versionSelect" style="width: auto; min-width: 145px;">
          <option value="康軒">康軒版</option>
          <option value="翰林">翰林版</option>
          <option value="南一">南一版</option>
          <option value="其他">其他／自訂</option>
        </select>
      </div>

      <div class="mode-tabs">
        <button id="tabPractice" class="btn-secondary active" onclick="switchTab('practice')">
          拍錯題作答（可批次）
        </button>
        <button id="tabReview" class="btn-secondary" onclick="switchTab('review')">
          錯題複習本 (<span id="wrongCount">0</span>)
        </button>
      </div>
    </div>

    <div id="practiceSection" class="card">
      <div class="row-3">
        <div class="field-group">
          <label for="subjectSelect">科目</label>
          <select id="subjectSelect">
            <option value="國語">國語</option>
            <option value="數學">數學</option>
            <option value="自然">自然</option>
            <option value="社會">社會</option>
          </select>
        </div>

        <div class="field-group">
          <label for="batchCount">這批要記幾題（1～20）</label>
          <input id="batchCount" type="number" min="1" max="20" value="3" />
        </div>

        <div class="field-group">
          <label>題目照片（可選多張或連拍）</label>
          <div class="photo-actions">
            <button type="button" class="btn-primary" onclick="triggerGalleryPick()">
              選多張相簿
            </button>
            <button type="button" class="btn-secondary" onclick="triggerCameraCapture()">
              拍照加入
            </button>
          </div>
          <div id="photoFileName" class="photo-tip">尚未加入照片（可連續拍多張或一次選多張）</div>

          <input
            id="galleryInput"
            type="file"
            accept="image/*"
            multiple
            class="hidden"
            onchange="handlePhotoChange(event)"
          />
          <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
            class="hidden"
            onchange="handlePhotoChange(event)"
          />
        </div>
      </div>

      <div id="photoGrid" class="photo-grid"></div>

      <div class="field-group" style="margin-top: 12px;">
        <label for="questionText">題號／題目重點（可一行一題，也可留白自動編號）</label>
        <textarea id="questionText" placeholder="例如：&#10;第2題：形近字辨析&#10;第5題：分數應用題&#10;（若留白，會依上方「這批要記幾題」自動建立第 1～N 題並共用照片）"></textarea>
      </div>

      <div class="field-group">
        <label>快速填入作答（點 A/B/C/D 會附加到作答框，也可用逗號／空白一次填多題，如：A, C, B）</label>
        <div class="choices">
          <button type="button" class="choice-btn" onclick="appendChoice('userAnswer', 'A')">+ A</button>
          <button type="button" class="choice-btn" onclick="appendChoice('userAnswer', 'B')">+ B</button>
          <button type="button" class="choice-btn" onclick="appendChoice('userAnswer', 'C')">+ C</button>
          <button type="button" class="choice-btn" onclick="appendChoice('userAnswer', 'D')">+ D</button>
        </div>
        <input id="userAnswer" type="text" style="margin-top: 10px;" placeholder="作答內容（多題可用逗號分隔，例如：A, B, D）" />
      </div>

      <div class="row-2">
        <div class="field-group">
          <label for="correctAnswer">正確答案（多題可用逗號分隔，例如：C, B, A）</label>
          <input id="correctAnswer" type="text" placeholder="例如：C, B, A（可留白直接當錯題存檔）" />
        </div>
        <div class="field-group">
          <label for="parentNote">家長解析／錯因提醒</label>
          <input id="parentNote" type="text" placeholder="例如：這幾題都是題意沒看清楚，先圈出關鍵字" />
        </div>
      </div>

      <div class="action-bar">
        <button class="btn-primary" onclick="submitBatchAnswer()">批次批改（答錯自動存錯題）</button>
        <button class="btn-danger-soft" onclick="saveBatchMistakesDirect()">整批直接存進錯題本</button>
        <button class="btn-secondary" onclick="clearForm()">清空重填</button>
      </div>

      <div id="feedbackBox" class="feedback"></div>
    </div>

    <div id="reviewSection" class="card hidden">
      <div class="header-top">
        <div>
          <h2 style="margin: 0; font-size: 1.15rem;">待複習錯題清單</h2>
          <p class="subtitle">只挑做錯或還沒練熟的題目重練，答對可移出待複習</p>
        </div>
        <div class="action-bar" style="margin-top: 0;">
          <button id="filterPendingBtn" class="btn-secondary active" onclick="setReviewFilter('pending')">
            只看待複習
          </button>
          <button id="filterAllBtn" class="btn-secondary" onclick="setReviewFilter('all')">
            全部紀錄
          </button>
          <button class="btn-danger-soft" onclick="clearAllMistakes()">清空全部</button>
        </div>
      </div>

      <div id="mistakeList"></div>
    </div>

    <div class="card">
      <p class="footer-note" style="margin: 0 0 10px;">
        <strong>敲碗許願／進階協助：</strong>還缺哪個年級、科目或課本版本？或是想找每週固定幫整理重練卷與家長解析？
      </p>
      <div class="action-bar" style="margin-top: 0;">
        <button class="btn-secondary" onclick="alert('歡迎把想要的年級、科目或課本版本留言告訴我，優先排入下一版！')">
          敲碗許願缺的版本
        </button>
        <button class="btn-success" onclick="alert('想找每週幫整理錯題重練卷＋家長解析，歡迎直接私訊或聯繫洽詢方案！')">
          了解每週代整理方案
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'wrong_note_items_v3';
    let currentPhotos = [];
    let reviewFilter = 'pending';

    function loadMistakes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveMistakes(items) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        renderMistakes();
        return true;
      } catch (err) {
        alert('本機儲存空間已滿（可能是照片太多），請先刪除部分舊錯題或清空紀錄再存新照片。');
        return false;
      }
    }

    function switchTab(tab) {
      const isPractice = tab === 'practice';
      document.getElementById('practiceSection').classList.toggle('hidden', !isPractice);
      document.getElementById('reviewSection').classList.toggle('hidden', isPractice);
      document.getElementById('tabPractice').classList.toggle('active', isPractice);
      document.getElementById('tabReview').classList.toggle('active', !isPractice);
      if (!isPractice) renderMistakes();
    }

    function setReviewFilter(mode) {
      reviewFilter = mode;
      document.getElementById('filterPendingBtn').classList.toggle('active', mode === 'pending');
      document.getElementById('filterAllBtn').classList.toggle('active', mode === 'all');
      renderMistakes();
    }

    function triggerGalleryPick() {
      const input = document.getElementById('galleryInput');
      input.value = '';
      input.click();
    }

    function triggerCameraCapture() {
      const input = document.getElementById('cameraInput');
      input.value = '';
      input.click();
    }

    function compressImageFile(file, maxWidth = 850, quality = 0.68) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('讀取照片失敗'));
        reader.onload = function (e) {
          const img = new Image();
          img.onerror = () => reject(new Error('圖片解碼失敗'));
          img.onload = function () {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handlePhotoChange(event) {
      const files = Array.from(event.target.files || []);
      const tipEl = document.getElementById('photoFileName');
      if (files.length === 0) return;

      tipEl.textContent = `正在處理 ${files.length} 張照片...`;
      let added = 0;

      for (const file of files) {
        try {
          const dataUrl = await compressImageFile(file);
          currentPhotos.push({
            name: file.name || `照片_${currentPhotos.length + 1}`,
            data: dataUrl
          });
          added += 1;
        } catch {
          // 單張失敗不中斷其餘照片
        }
      }

      renderPhotoGrid();
      tipEl.textContent =
        added > 0
          ? `目前共有 ${currentPhotos.length} 張照片（可繼續加拍或加選）`
          : '照片載入失敗，請改用「選多張相簿」或用 Safari／Chrome 開啟網頁再試一次。';
    }

    function removePhoto(index) {
      currentPhotos.splice(index, 1);
      renderPhotoGrid();
      document.getElementById('photoFileName').textContent =
        currentPhotos.length > 0
          ? `目前共有 ${currentPhotos.length} 張照片`
          : '尚未加入照片（可連續拍多張或一次選多張）';
    }

    function renderPhotoGrid() {
      const grid = document.getElementById('photoGrid');
      if (currentPhotos.length === 0) {
        grid.innerHTML = '';
        return;
      }

      grid.innerHTML = currentPhotos
        .map(
          (p, idx) => `
          <div class="photo-thumb-card">
            <img src="${p.data}" alt="題目照片 ${idx + 1}" />
            <button type="button" class="remove-photo-btn" onclick="removePhoto(${idx})">移除第 ${idx + 1} 張</button>
          </div>
        `
        )
        .join('');
    }

    function appendChoice(inputId, choice) {
      const el = document.getElementById(inputId);
      const current = el.value.trim();
      el.value = current ? `${current}, ${choice}` : choice;
    }

    function parseList(raw) {
      if (!raw || !raw.trim()) return [];
      return raw
        .split(/[\n,，、]+/)
        .map((s) => s.trim())
        .filter(Boolean);
    }

    function buildBatchQuestions() {
      const rawLines = document
        .getElementById('questionText')
        .value.split('\n')
        .map((s) => s.trim())
        .filter(Boolean);
      const userList = parseList(document.getElementById('userAnswer').value);
      const correctList = parseList(document.getElementById('correctAnswer').value);
      const countInput = Math.max(1, Math.min(20, parseInt(document.getElementById('batchCount').value, 10) || 1));

      const total = Math.max(countInput, rawLines.length, userList.length, correctList.length);
      const photoUrls = currentPhotos.map((p) => p.data);

      const batch = [];
      for (let i = 0; i < total; i++) {
        const photoForThis = photoUrls[i] || photoUrls[0] || '';
        const qTitle =
          rawLines[i] ||
          (photoUrls.length > 0
            ? `第 ${i + 1} 題（對照第 ${Math.min(i + 1, photoUrls.length)} 張照片作答）`
            : `第 ${i + 1} 題`);

        batch.push({
          index: i + 1,
          question: qTitle,
          userAnswer: userList[i] || '',
          correctAnswer: correctList[i] || '',
          photo: photoForThis
        });
      }
      return batch;
    }

    function upsertMistakeItem(items, version, subject, parentNote, entry) {
      const existingIndex = items.findIndex(
        (x) => !x.mastered && x.question === entry.question && x.subject === subject && x.version === version
      );

      if (existingIndex >= 0) {
        items[existingIndex].wrongCount += 1;
        items[existingIndex].lastWrongAt = new Date().toLocaleString('zh-TW');
        if (entry.userAnswer) items[existingIndex].userAnswer = entry.userAnswer;
        if (entry.correctAnswer) items[existingIndex].correctAnswer = entry.correctAnswer;
        if (parentNote) items[existingIndex].parentNote = parentNote;
        if (entry.photo) items[existingIndex].photo = entry.photo;
      } else {
        items.unshift({
          id: Date.now() + Math.random(),
          version,
          subject,
          question: entry.question,
          userAnswer: entry.userAnswer,
          correctAnswer: entry.correctAnswer,
          parentNote: parentNote || '請對照題目條件與課本觀念再檢查一次。',
          photo: entry.photo || '',
          wrongCount: 1,
          lastWrongAt: new Date().toLocaleString('zh-TW'),
          mastered: false
        });
      }
    }

    function submitBatchAnswer() {
      const version = document.getElementById('versionSelect').value;
      const subject = document.getElementById('subjectSelect').value;
      const parentNote = document.getElementById('parentNote').value.trim();
      const feedback = document.getElementById('feedbackBox');
      const batch = buildBatchQuestions();

      if (currentPhotos.length === 0 && !document.getElementById('questionText').value.trim()) {
        feedback.className = 'feedback wrong';
        feedback.innerHTML = '請先加入照片或輸入題目內容再進行批次批改。';
        return;
      }

      const items = loadMistakes();
      let rightCount = 0;
      let wrongCountBatch = 0;
      const detailLines = [];

      for (const entry of batch) {
        if (!entry.correctAnswer) {
          upsertMistakeItem(items, version, subject, parentNote, entry);
          wrongCountBatch += 1;
          detailLines.push(`• ${escapeHtml(entry.question)}：未填正答，已收入錯題本`);
          continue;
        }

        const isRight = entry.userAnswer.toLowerCase() === entry.correctAnswer.toLowerCase();
        if (isRight) {
          rightCount += 1;
          detailLines.push(`• ${escapeHtml(entry.question)}：答對（${escapeHtml(entry.userAnswer)}）`);
        } else {
          upsertMistakeItem(items, version, subject, parentNote, entry);
          wrongCountBatch += 1;
          detailLines.push(
            `• ${escapeHtml(entry.question)}：作答「${escapeHtml(entry.userAnswer || '未填')}」／正答「<strong>${escapeHtml(entry.correctAnswer)}</strong>」→ 已存錯題本`
          );
        }
      }

      if (!saveMistakes(items)) return;

      feedback.className = wrongCountBatch > 0 ? 'feedback wrong' : 'feedback right';
      feedback.innerHTML = `
        <strong>批次批改完成！共 ${batch.length} 題：答對 ${rightCount} 題、列入錯題 ${wrongCountBatch} 題。</strong><br>
        ${parentNote ? `家長提醒：${escapeHtml(parentNote)}<br>` : ''}
        <div style="margin-top: 8px; font-size: 0.92rem;">${detailLines.join('<br>')}</div>
      `;
    }

    function saveBatchMistakesDirect() {
      const version = document.getElementById('versionSelect').value;
      const subject = document.getElementById('subjectSelect').value;
      const parentNote = document.getElementById('parentNote').value.trim();
      const feedback = document.getElementById('feedbackBox');
      const batch = buildBatchQuestions();

      if (currentPhotos.length === 0 && !document.getElementById('questionText').value.trim()) {
        feedback.className = 'feedback wrong';
        feedback.innerHTML = '請先加入照片或輸入題目內容再存進錯題本。';
        return;
      }

      const items = loadMistakes();
      for (const entry of batch) {
        upsertMistakeItem(items, version, subject, parentNote, entry);
      }

      if (!saveMistakes(items)) return;

      feedback.className = 'feedback wrong';
      feedback.innerHTML = `<strong>已一次將 ${batch.length} 題存進錯題複習本！</strong> 隨時可切到「錯題複習本」逐題重練。`;
    }

    function markMastered(id) {
      const items = loadMistakes().map((item) =>
        item.id === id ? { ...item, mastered: !item.mastered } : item
      );
      saveMistakes(items);
    }

    function deleteMistake(id) {
      const items = loadMistakes().filter((item) => item.id !== id);
      saveMistakes(items);
    }

    function clearAllMistakes() {
      if (!confirm('確定要清空所有錯題紀錄嗎？')) return;
      saveMistakes([]);
    }

    function clearForm() {
      document.getElementById('questionText').value = '';
      document.getElementById('userAnswer').value = '';
      document.getElementById('correctAnswer').value = '';
      document.getElementById('parentNote').value = '';
      document.getElementById('galleryInput').value = '';
      document.getElementById('cameraInput').value = '';
      document.getElementById('photoFileName').textContent = '尚未加入照片（可連續拍多張或一次選多張）';
      document.getElementById('feedbackBox').className = 'feedback';
      currentPhotos = [];
      renderPhotoGrid();
    }

    function renderMistakes() {
      const allItems = loadMistakes();
      const pending = allItems.filter((x) => !x.mastered);
      document.getElementById('wrongCount').textContent = pending.length;

      const listEl = document.getElementById('mistakeList');
      if (!listEl) return;

      const visibleItems = reviewFilter === 'pending' ? pending : allItems;

      if (visibleItems.length === 0) {
        listEl.innerHTML =
          reviewFilter === 'pending'
            ? '<p class="subtitle" style="margin-top: 14px;">目前沒有待複習錯題！可以切到「全部紀錄」查看已掌握題目，或去「拍錯題作答」新增。</p>'
            : '<p class="subtitle" style="margin-top: 14px;">目前還沒有錯題紀錄，去「拍錯題作答」批次新增吧！</p>';
        return;
      }

      listEl.innerHTML = visibleItems
        .map(
          (item) => `
          <div class="mistake-item">
            <div class="mistake-meta">
              <span class="badge ${item.mastered ? 'ok' : ''}">
                ${item.mastered ? '已掌握' : `錯 ${item.wrongCount} 次`}
              </span>
              ${escapeHtml(item.version)}・${escapeHtml(item.subject)}・上次紀錄：${escapeHtml(item.lastWrongAt)}
            </div>
            <div style="font-weight: 600; margin-bottom: 6px;">${escapeHtml(item.question)}</div>
            ${
              item.photo
                ? `<img src="${item.photo}" alt="錯題照片" style="max-height: 180px; border-radius: 8px; margin-bottom: 8px; display: block;" />`
                : ''
            }
            <div style="font-size: 0.92rem; color: #334155;">
              作答：${escapeHtml(item.userAnswer || '未填')}｜正答：<strong>${escapeHtml(item.correctAnswer || '待補充')}</strong>｜家長解析：${escapeHtml(item.parentNote)}
            </div>
            <div class="action-bar">
              <button class="btn-success" onclick="markMastered(${item.id})">
                ${item.mastered ? '改回待複習' : '答對了！移出待複習'}
              </button>
              <button class="btn-secondary" onclick="deleteMistake(${item.id})">刪除</button>
            </div>
          </div>
        `
        )
        .join('');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    renderMistakes();
  </script>
</body>
</html>
