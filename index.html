<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>錯題重練小工具｜拍照作答與錯題記憶</title>
  <style>
    /* ====== 樣式調整區（顏色、圓角、卡片、按鈕都在這裡改） ====== */
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary.active {
      background: var(--primary);
      color: #fff;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger-soft {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .field-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    select,
    input[type="text"],
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      background: #fff;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 540px) {
      .row-2 {
        grid-template-columns: 1fr;
      }
    }

    .photo-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .photo-tip {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      word-break: break-all;
    }

    .photo-preview {
      margin-top: 10px;
      max-height: 260px;
      width: 100%;
      object-fit: contain;
      border-radius: 12px;
      border: 1px dashed var(--border);
      display: none;
      background: #f8fafc;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .choice-btn {
      padding: 14px;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      font-size: 1.05rem;
    }

    .choice-btn.selected {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
    }

    .feedback {
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      display: none;
    }

    .feedback.wrong {
      display: block;
      background: var(--danger-bg);
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .feedback.right {
      display: block;
      background: var(--success-bg);
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .mistake-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      background: #fff;
    }

    .mistake-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #fee2e2;
      color: #b91c1c;
      margin-right: 6px;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    .footer-note {
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="header-top">
        <div>
          <h1>錯題重練小工具</h1>
          <p class="subtitle">拍照／選圖直接作答，做錯自動記住，考前只練錯題</p>
        </div>
        <select id="versionSelect" style="width: auto; min-width: 145px;">
          <option value="康軒">康軒版</option>
          <option value="翰林">翰林版</option>
          <option value="南一">南一版</option>
          <option value="其他">其他／自訂</option>
        </select>
      </div>

      <div class="mode-tabs">
        <button id="tabPractice" class="btn-secondary active" onclick="switchTab('practice')">
          拍錯題作答
        </button>
        <button id="tabReview" class="btn-secondary" onclick="switchTab('review')">
          錯題複習本 (<span id="wrongCount">0</span>)
        </button>
      </div>
    </div>

    <div id="practiceSection" class="card">
      <div class="row-2">
        <div class="field-group">
          <label for="subjectSelect">科目</label>
          <select id="subjectSelect">
            <option value="國語">國語</option>
            <option value="數學">數學</option>
            <option value="自然">自然</option>
            <option value="社會">社會</option>
          </select>
        </div>

        <div class="field-group">
          <label>題目照片（可選相簿或直接拍照）</label>
          <div class="photo-actions">
            <button type="button" class="btn-primary" onclick="triggerGalleryPick()">
              選相簿／檔案
            </button>
            <button type="button" class="btn-secondary" onclick="triggerCameraCapture()">
              直接拍照
            </button>
          </div>
          <div id="photoFileName" class="photo-tip">尚未選擇照片</div>

          <input
            id="galleryInput"
            type="file"
            accept="image/*"
            class="hidden"
            onchange="handlePhotoChange(event)"
          />
          <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
            class="hidden"
            onchange="handlePhotoChange(event)"
          />
        </div>
      </div>

      <img id="photoPreview" class="photo-preview" alt="題目照片預覽" />

      <div class="field-group" style="margin-top: 12px;">
        <label for="questionText">題目內容或重點摘要</label>
        <textarea id="questionText" placeholder="例如：下列哪一個詞語的字形完全正確？或輸入題目敘述..."></textarea>
      </div>

      <div class="field-group">
        <label>作答方式（可點選項，也可直接填答案）</label>
        <div class="choices">
          <button type="button" class="choice-btn" onclick="selectChoice('A', this)">A</button>
          <button type="button" class="choice-btn" onclick="selectChoice('B', this)">B</button>
          <button type="button" class="choice-btn" onclick="selectChoice('C', this)">C</button>
          <button type="button" class="choice-btn" onclick="selectChoice('D', this)">D</button>
        </div>
        <input id="userAnswer" type="text" style="margin-top: 10px;" placeholder="作答內容（例如 A，或輸入算式／答案）" />
      </div>

      <div class="row-2">
        <div class="field-group">
          <label for="correctAnswer">正確答案</label>
          <input id="correctAnswer" type="text" placeholder="例如：C" />
        </div>
        <div class="field-group">
          <label for="parentNote">家長解析／錯因提醒</label>
          <input id="parentNote" type="text" placeholder="例如：注意形近字部首差異，先對照課本生字表" />
        </div>
      </div>

      <div class="action-bar">
        <button class="btn-primary" onclick="submitAnswer()">送出作答並判斷</button>
        <button class="btn-danger-soft" onclick="saveAsMistakeDirect()">直接存進錯題本</button>
        <button class="btn-secondary" onclick="clearForm()">清空重填</button>
      </div>

      <div id="feedbackBox" class="feedback"></div>
    </div>

    <div id="reviewSection" class="card hidden">
      <div class="header-top">
        <div>
          <h2 style="margin: 0; font-size: 1.15rem;">待複習錯題清單</h2>
          <p class="subtitle">只挑做錯或還沒練熟的題目重練，答對可移出待複習</p>
        </div>
        <button class="btn-danger-soft" onclick="clearAllMistakes()">清空全部紀錄</button>
      </div>

      <div id="mistakeList"></div>
    </div>

    <div class="card">
      <p class="footer-note" style="margin: 0 0 10px;">
        <strong>敲碗許願／進階協助：</strong>還缺哪個年級、科目或課本版本？或是想找每週固定幫整理重練卷與家長解析？
      </p>
      <div class="action-bar" style="margin-top: 0;">
        <button class="btn-secondary" onclick="alert('歡迎把想要的年級、科目或課本版本留言告訴我，優先排入下一版！')">
          敲碗許願缺的版本
        </button>
        <button class="btn-success" onclick="alert('想找每週幫整理錯題重練卷＋家長解析，歡迎直接私訊或聯繫洽詢方案！')">
          了解每週代整理方案
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'wrong_note_items_v2';
    let currentPhotoData = '';
    let selectedChoice = '';

    function loadMistakes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveMistakes(items) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        renderMistakes();
        return true;
      } catch (err) {
        alert('本機儲存空間已滿（可能是照片太多），請先刪除部分舊錯題或清空紀錄再存新照片。');
        return false;
      }
    }

    function switchTab(tab) {
      const isPractice = tab === 'practice';
      document.getElementById('practiceSection').classList.toggle('hidden', !isPractice);
      document.getElementById('reviewSection').classList.toggle('hidden', isPractice);
      document.getElementById('tabPractice').classList.toggle('active', isPractice);
      document.getElementById('tabReview').classList.toggle('active', !isPractice);
      if (!isPractice) renderMistakes();
    }

    function triggerGalleryPick() {
      const input = document.getElementById('galleryInput');
      input.value = '';
      input.click();
    }

    function triggerCameraCapture() {
      const input = document.getElementById('cameraInput');
      input.value = '';
      input.click();
    }

    function compressImageFile(file, maxWidth = 900, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('讀取照片失敗'));
        reader.onload = function (e) {
          const img = new Image();
          img.onerror = () => reject(new Error('圖片解碼失敗'));
          img.onload = function () {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handlePhotoChange(event) {
      const file = event.target.files && event.target.files[0];
      const tipEl = document.getElementById('photoFileName');
      const imgEl = document.getElementById('photoPreview');
      if (!file) return;

      tipEl.textContent = '照片處理中，請稍候...';
      try {
        currentPhotoData = await compressImageFile(file);
        imgEl.src = currentPhotoData;
        imgEl.style.display = 'block';
        tipEl.textContent = `已載入照片：${file.name || '相機照片'}`;
      } catch (err) {
        currentPhotoData = '';
        imgEl.style.display = 'none';
        tipEl.textContent = '照片載入失敗，請改用「選相簿／檔案」或用 Safari／Chrome 開啟網頁再試一次。';
      }
    }

    function selectChoice(choice, btnEl) {
      selectedChoice = choice;
      document.getElementById('userAnswer').value = choice;
      document.querySelectorAll('.choice-btn').forEach((b) => b.classList.remove('selected'));
      btnEl.classList.add('selected');
    }

    function addOrUpdateMistake(itemData) {
      const items = loadMistakes();
      const existingIndex =
        itemData.question && itemData.question.trim() && itemData.question.trim() !== '（已附上題目照片，請對照圖片作答）'
          ? items.findIndex((x) => x.question.trim() === itemData.question.trim())
          : -1;

      if (existingIndex >= 0) {
        items[existingIndex].wrongCount += 1;
        items[existingIndex].lastWrongAt = new Date().toLocaleString('zh-TW');
        items[existingIndex].userAnswer = itemData.userAnswer || items[existingIndex].userAnswer;
        items[existingIndex].correctAnswer = itemData.correctAnswer || items[existingIndex].correctAnswer;
        items[existingIndex].parentNote = itemData.parentNote || items[existingIndex].parentNote;
        if (itemData.photo) items[existingIndex].photo = itemData.photo;
        items[existingIndex].mastered = false;
      } else {
        items.unshift({
          id: Date.now(),
          version: itemData.version,
          subject: itemData.subject,
          question: itemData.question || '（已附上題目照片，請對照圖片作答）',
          userAnswer: itemData.userAnswer,
          correctAnswer: itemData.correctAnswer,
          parentNote: itemData.parentNote || '請對照課本觀念與題意再檢查一次。',
          photo: itemData.photo || '',
          wrongCount: 1,
          lastWrongAt: new Date().toLocaleString('zh-TW'),
          mastered: false
        });
      }

      return saveMistakes(items);
    }

    function submitAnswer() {
      const version = document.getElementById('versionSelect').value;
      const subject = document.getElementById('subjectSelect').value;
      const question = document.getElementById('questionText').value.trim();
      const userAns = document.getElementById('userAnswer').value.trim();
      const correctAns = document.getElementById('correctAnswer').value.trim();
      const parentNote = document.getElementById('parentNote').value.trim();
      const feedback = document.getElementById('feedbackBox');

      if (!question && !currentPhotoData) {
        feedback.className = 'feedback wrong';
        feedback.innerHTML = '請先拍照或從相簿選圖，或輸入題目內容再送出作答。';
        return;
      }

      if (!correctAns) {
        const saved = addOrUpdateMistake({
          version,
          subject,
          question,
          userAnswer: userAns,
          correctAnswer: '',
          parentNote,
          photo: currentPhotoData
        });
        if (!saved) return;
        feedback.className = 'feedback wrong';
        feedback.innerHTML = `<strong>已收入錯題複習本！</strong><br>家長解析：${parentNote || '先一起看題目關鍵字與課本範例。'}`;
        return;
      }

      const isRight = userAns.toLowerCase() === correctAns.toLowerCase();
      if (isRight) {
        feedback.className = 'feedback right';
        feedback.innerHTML = `<strong>答對了！很棒！</strong><br>家長提醒：${parentNote || '觀念掌握得不錯，考前抽查一次即可。'}`;
      } else {
        const saved = addOrUpdateMistake({
          version,
          subject,
          question,
          userAnswer: userAns,
          correctAnswer: correctAns,
          parentNote,
          photo: currentPhotoData
        });
        if (!saved) return;
        feedback.className = 'feedback wrong';
        feedback.innerHTML = `
          <strong>這題答錯了，已自動加入錯題複習本！</strong><br>
          你的作答：${userAns || '未填寫'} ｜ 正確答案：<strong>${correctAns}</strong><br>
          家長解析：${parentNote || '先找出題目關鍵條件，再對照課本例題重新算一次。'}
        `;
      }
    }

    function saveAsMistakeDirect() {
      const version = document.getElementById('versionSelect').value;
      const subject = document.getElementById('subjectSelect').value;
      const question = document.getElementById('questionText').value.trim();
      const userAns = document.getElementById('userAnswer').value.trim();
      const correctAns = document.getElementById('correctAnswer').value.trim();
      const parentNote = document.getElementById('parentNote').value.trim();

      const saved = addOrUpdateMistake({
        version,
        subject,
        question,
        userAnswer: userAns,
        correctAnswer: correctAns,
        parentNote,
        photo: currentPhotoData
      });
      if (!saved) return;

      const feedback = document.getElementById('feedbackBox');
      feedback.className = 'feedback wrong';
      feedback.innerHTML = '<strong>已直接存進錯題複習本！</strong> 隨時可切到「錯題複習本」重練。';
    }

    function markMastered(id) {
      const items = loadMistakes().map((item) =>
        item.id === id ? { ...item, mastered: !item.mastered } : item
      );
      saveMistakes(items);
    }

    function deleteMistake(id) {
      const items = loadMistakes().filter((item) => item.id !== id);
      saveMistakes(items);
    }

    function clearAllMistakes() {
      if (!confirm('確定要清空所有錯題紀錄嗎？')) return;
      saveMistakes([]);
    }

    function clearForm() {
      document.getElementById('questionText').value = '';
      document.getElementById('userAnswer').value = '';
      document.getElementById('correctAnswer').value = '';
      document.getElementById('parentNote').value = '';
      document.getElementById('galleryInput').value = '';
      document.getElementById('cameraInput').value = '';
      document.getElementById('photoFileName').textContent = '尚未選擇照片';
      document.getElementById('photoPreview').style.display = 'none';
      document.getElementById('feedbackBox').className = 'feedback';
      currentPhotoData = '';
      selectedChoice = '';
      document.querySelectorAll('.choice-btn').forEach((b) => b.classList.remove('selected'));
    }

    function renderMistakes() {
      const items = loadMistakes();
      const pending = items.filter((x) => !x.mastered);
      document.getElementById('wrongCount').textContent = pending.length;

      const listEl = document.getElementById('mistakeList');
      if (!listEl) return;

      if (items.length === 0) {
        listEl.innerHTML = '<p class="subtitle" style="margin-top: 14px;">目前還沒有錯題紀錄，去「拍錯題作答」新增第一題吧！</p>';
        return;
      }

      listEl.innerHTML = items
        .map(
          (item) => `
          <div class="mistake-item">
            <div class="mistake-meta">
              <span class="badge">${item.mastered ? '已掌握' : `錯 ${item.wrongCount} 次`}</span>
              ${item.version}・${item.subject}・上次紀錄：${item.lastWrongAt}
            </div>
            <div style="font-weight: 600; margin-bottom: 6px;">${escapeHtml(item.question)}</div>
            ${
              item.photo
                ? `<img src="${item.photo}" alt="錯題照片" style="max-height: 180px; border-radius: 8px; margin-bottom: 8px; display: block;" />`
                : ''
            }
            <div style="font-size: 0.92rem; color: #334155;">
              正答：<strong>${escapeHtml(item.correctAnswer || '待補充')}</strong>｜家長解析：${escapeHtml(item.parentNote)}
            </div>
            <div class="action-bar">
              <button class="btn-success" onclick="markMastered(${item.id})">
                ${item.mastered ? '改回待複習' : '答對了！移出待複習'}
              </button>
              <button class="btn-secondary" onclick="deleteMistake(${item.id})">刪除</button>
            </div>
          </div>
        `
        )
        .join('');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    renderMistakes();
  </script>
</body>
</html>
