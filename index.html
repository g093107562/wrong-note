<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>錯題不放過小工具｜拍考卷揪錯、重寫過關</title>
  <style>
    /* =========================================================
       樣式區（換顏色、圓角、按鈕、卡片間距，直接改這裡最快）
       ========================================================= */
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --danger-border: #fecaca;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --success-border: #bbf7d0;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 18px;
      --shadow: 0 6px 24px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: 1.38rem;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary.active {
      background: var(--primary);
      color: #fff;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger-soft {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    .field-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 0.94rem;
    }

    select,
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      background: #fff;
      color: var(--text);
    }

    select:focus,
    input:focus,
    textarea:focus {
      outline: 2px solid rgba(37, 99, 235, 0.22);
      border-color: var(--primary);
    }

    textarea {
      min-height: 74px;
      resize: vertical;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr;
      gap: 12px;
    }

    @media (max-width: 620px) {
      .row-2,
      .row-3 {
        grid-template-columns: 1fr;
      }
    }

    .photo-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .photo-tip {
      margin-top: 6px;
      font-size: 0.84rem;
      color: var(--muted);
      word-break: break-all;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .photo-thumb-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      background: #f8fafc;
    }

    .photo-thumb-card img {
      width: 100%;
      height: 112px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .remove-photo-btn {
      margin-top: 6px;
      width: 100%;
      padding: 6px 8px;
      font-size: 0.82rem;
      border-radius: 8px;
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .choice-btn {
      padding: 11px 8px;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      font-size: 0.96rem;
    }

    .choice-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .feedback {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      display: none;
    }

    .feedback.wrong {
      display: block;
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      color: #991b1b;
    }

    .feedback.right {
      display: block;
      background: var(--success-soft);
      border: 1px solid var(--success-border);
      color: #166534;
    }

    .mistake-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      background: #fff;
    }

    .mistake-meta {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #fee2e2;
      color: #b91c1c;
      margin-right: 6px;
    }

    .badge.ok {
      background: #dcfce7;
      color: #15803d;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    .cta-box {
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
      border: 1px solid #dbeafe;
    }

    .footer-note {
      font-size: 0.92rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="header-top">
        <div>
          <span class="brand-tag">錯題不放過・重寫過關</span>
          <h1>拍考卷揪錯 → 重寫對了才過關</h1>
          <p class="subtitle">先拍考卷、對課本／習作揪出錯在哪，再讓孩子重新寫一次，對了過關、錯了不放過</p>
        </div>
        <select id="versionSelect" style="width: auto; min-width: 140px;">
          <option value="康軒">康軒版</option>
          <option value="翰林">翰林版</option>
          <option value="南一">南一版</option>
          <option value="其他">其他／自訂</option>
        </select>
      </div>

      <div class="mode-tabs">
        <button id="tabPractice" class="btn-secondary active" onclick="switchTab('practice')">
          1. 拍考卷／重寫測驗
        </button>
        <button id="tabReview" class="btn-secondary" onclick="switchTab('review')">
          2. 不放過錯題本 (<span id="wrongCount">0</span>)
        </button>
      </div>
    </div>

    <div id="practiceSection" class="card">
      <div class="row-3">
        <div class="field-group">
          <label for="subjectSelect">科目</label>
          <select id="subjectSelect">
            <option value="數學">數學</option>
            <option value="國語">國語</option>
            <option value="自然">自然</option>
            <option value="社會">社會</option>
            <option value="英文">英文</option>
          </select>
        </div>

        <div class="field-group">
          <label for="batchCount">這批幾題</label>
          <input id="batchCount" type="number" min="1" max="20" value="1" />
        </div>

        <div class="field-group">
          <label>拍考卷／選照片</label>
          <div class="photo-actions">
            <button type="button" class="btn-primary" onclick="triggerCameraCapture()">
              拍考卷
            </button>
            <button type="button" class="btn-secondary" onclick="triggerGalleryPick()">
              選相簿多張
            </button>
          </div>
          <div id="photoFileName" class="photo-tip">尚未加入考卷照片（可拍多張或從相簿挑多張）</div>

          <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
            class="hidden"
            onchange="handlePhotoChange(event)"
          />
          <input
            id="galleryInput"
            type="file"
            accept="image/*"
            multiple
            class="hidden"
            onchange="handlePhotoChange(event)"
          />
        </div>
      </div>

      <div id="photoGrid" class="photo-grid"></div>

      <div class="field-group" style="margin-top: 12px;">
        <label for="questionText">題號或課本／習作對照位置（可留白自動編號）</label>
        <textarea
          id="questionText"
          placeholder="例如：第3題（對照課本第64頁、習作第46頁）或留白自動編第 1 題..."
        ></textarea>
      </div>

      <div class="field-group">
        <label>重寫作答（點 A/B/C/D 快速填入，多題用逗號隔開，如：A, C）</label>
        <div class="choices">
          <button type="button" class="choice-btn" onclick="appendChoice('userAnswer', 'A')">+ A</button>
          <button type="button" class="choice-btn" onclick="appendChoice('userAnswer', 'B')">+ B</button>
          <button type="button" class="choice-btn" onclick="appendChoice('userAnswer', 'C')">+ C</button>
          <button type="button" class="choice-btn" onclick="appendChoice('userAnswer', 'D')">+ D</button>
        </div>
        <input id="userAnswer" type="text" style="margin-top: 10px;" placeholder="輸入重寫答案（例如：B 或 A, C, D）" />
      </div>

      <div class="row-2">
        <div class="field-group">
          <label for="correctAnswer">課本／習作正確答案</label>
          <input id="correctAnswer" type="text" placeholder="例如：C 或 C, B, D" />
        </div>
        <div class="field-group">
          <label for="parentNote">揪出來的錯因（哪裡寫錯、觀念卡在哪）</label>
          <input id="parentNote" type="text" placeholder="例如：把「進」跟「近」搞混、算式少寫一步" />
        </div>
      </div>

      <div class="action-bar">
        <button class="btn-primary" onclick="submitBatchAnswer()">送出重寫（對了過關／錯了不放過）</button>
        <button class="btn-danger-soft" onclick="saveBatchMistakesDirect()">直接放進「不放過錯題本」</button>
        <button class="btn-secondary" onclick="clearForm()">清空重填</button>
      </div>

      <div id="feedbackBox" class="feedback"></div>
    </div>

    <div id="reviewSection" class="card hidden">
      <div class="header-top">
        <div>
          <h2 style="margin: 0; font-size: 1.15rem;">不放過錯題本</h2>
          <p class="subtitle">沒過關的會一直留在這裡，重寫答對才算過關</p>
        </div>
        <div class="action-bar" style="margin-top: 0;">
          <button id="filterPendingBtn" class="btn-secondary active" onclick="setReviewFilter('pending')">
            尚未過關
          </button>
          <button id="filterAllBtn" class="btn-secondary" onclick="setReviewFilter('all')">
            全部紀錄
          </button>
          <button class="btn-danger-soft" onclick="clearAllMistakes()">清空紀錄</button>
        </div>
      </div>

      <div id="mistakeList"></div>
    </div>

    <div class="card cta-box">
      <p class="footer-note" style="margin: 0 0 10px;">
        <strong>想要更多年級／科目版本，或每週有人幫整理錯題重寫清單？</strong>
      </p>
      <div class="action-bar" style="margin-top: 0;">
        <button class="btn-secondary" onclick="alert('歡迎留言告訴我們想加哪個年級、科目或課本版本！')">
          敲碗許願缺的版本
        </button>
        <button class="btn-success" onclick="alert('想了解每週整理錯題重寫＋解析方案，歡迎聯繫洽詢！')">
          了解每週代整理方案
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'wrong_note_no_mercy_v1';
    let currentPhotos = [];
    let reviewFilter = 'pending';

    function loadMistakes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveMistakes(items) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        renderMistakes();
        return true;
      } catch {
        alert('瀏覽器本機儲存空間已滿，建議先刪除部分舊錯題或清空紀錄。');
        return false;
      }
    }

    function switchTab(tab) {
      const isPractice = tab === 'practice';
      document.getElementById('practiceSection').classList.toggle('hidden', !isPractice);
      document.getElementById('reviewSection').classList.toggle('hidden', isPractice);
      document.getElementById('tabPractice').classList.toggle('active', isPractice);
      document.getElementById('tabReview').classList.toggle('active', !isPractice);
      if (!isPractice) renderMistakes();
    }

    function setReviewFilter(mode) {
      reviewFilter = mode;
      document.getElementById('filterPendingBtn').classList.toggle('active', mode === 'pending');
      document.getElementById('filterAllBtn').classList.toggle('active', mode === 'all');
      renderMistakes();
    }

    function triggerCameraCapture() {
      const input = document.getElementById('cameraInput');
      input.value = '';
      input.click();
    }

    function triggerGalleryPick() {
      const input = document.getElementById('galleryInput');
      input.value = '';
      input.click();
    }

    function compressImageFile(file, maxWidth = 850, quality = 0.68) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('讀取照片失敗'));
        reader.onload = function (e) {
          const img = new Image();
          img.onerror = () => reject(new Error('圖片解碼失敗'));
          img.onload = function () {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handlePhotoChange(event) {
      const files = Array.from(event.target.files || []);
      const tipEl = document.getElementById('photoFileName');
      if (files.length === 0) return;

      tipEl.textContent = `處理照片中（共 ${files.length} 張）...`;
      let added = 0;

      for (const file of files) {
        try {
          const dataUrl = await compressImageFile(file);
          currentPhotos.push({
            name: file.name || `考卷_${currentPhotos.length + 1}`,
            data: dataUrl
          });
          added += 1;
        } catch {
          // 單張失敗不中斷其他照片
        }
      }

      renderPhotoGrid();
      tipEl.textContent =
        added > 0
          ? `已加入 ${currentPhotos.length} 張考卷照片（可繼續拍或選圖）`
          : '照片載入失敗，請改用「選相簿多張」或用瀏覽器開啟再試一次。';
    }

    function removePhoto(index) {
      currentPhotos.splice(index, 1);
      renderPhotoGrid();
      document.getElementById('photoFileName').textContent =
        currentPhotos.length > 0
          ? `已加入 ${currentPhotos.length} 張考卷照片`
          : '尚未加入考卷照片（可拍多張或從相簿挑多張）';
    }

    function renderPhotoGrid() {
      const grid = document.getElementById('photoGrid');
      if (currentPhotos.length === 0) {
        grid.innerHTML = '';
        return;
      }

      grid.innerHTML = currentPhotos
        .map(
          (p, idx) => `
          <div class="photo-thumb-card">
            <img src="${p.data}" alt="考卷照片 ${idx + 1}" />
            <button type="button" class="remove-photo-btn" onclick="removePhoto(${idx})">移除第 ${idx + 1} 張</button>
          </div>
        `
        )
        .join('');
    }

    function appendChoice(inputId, choice) {
      const el = document.getElementById(inputId);
      const current = el.value.trim();
      el.value = current ? `${current}, ${choice}` : choice;
    }

    function parseList(raw) {
      if (!raw || !raw.trim()) return [];
      return raw
        .split(/[\n,，、]+/)
        .map((s) => s.trim())
        .filter(Boolean);
    }

    function buildBatchQuestions() {
      const rawLines = document
        .getElementById('questionText')
        .value.split('\n')
        .map((s) => s.trim())
        .filter(Boolean);
      const userList = parseList(document.getElementById('userAnswer').value);
      const correctList = parseList(document.getElementById('correctAnswer').value);
      const countInput = Math.max(
        1,
        Math.min(20, parseInt(document.getElementById('batchCount').value, 10) || 1)
      );

      const total = Math.max(countInput, rawLines.length, userList.length, correctList.length);
      const photoUrls = currentPhotos.map((p) => p.data);

      const batch = [];
      for (let i = 0; i < total; i++) {
        const photoForThis = photoUrls[i] || photoUrls[0] || '';
        const qTitle =
          rawLines[i] ||
          (photoUrls.length > 0
            ? `第 ${i + 1} 題（對照第 ${Math.min(i + 1, photoUrls.length)} 張考卷）`
            : `第 ${i + 1} 題`);

        batch.push({
          index: i + 1,
          question: qTitle,
          userAnswer: userList[i] || '',
          correctAnswer: correctList[i] || '',
          photo: photoForThis
        });
      }
      return batch;
    }

    function upsertMistakeItem(items, version, subject, parentNote, entry) {
      const existingIndex = items.findIndex(
        (x) => !x.mastered && x.question === entry.question && x.subject === subject && x.version === version
      );

      if (existingIndex >= 0) {
        items[existingIndex].wrongCount += 1;
        items[existingIndex].lastWrongAt = new Date().toLocaleString('zh-TW');
        if (entry.userAnswer) items[existingIndex].userAnswer = entry.userAnswer;
        if (entry.correctAnswer) items[existingIndex].correctAnswer = entry.correctAnswer;
        if (parentNote) items[existingIndex].parentNote = parentNote;
        if (entry.photo) items[existingIndex].photo = entry.photo;
      } else {
        items.unshift({
          id: Date.now() + Math.random(),
          version,
          subject,
          question: entry.question,
          userAnswer: entry.userAnswer,
          correctAnswer: entry.correctAnswer,
          parentNote: parentNote || '對照課本與習作找出錯因，再重寫一次。',
          photo: entry.photo || '',
          wrongCount: 1,
          lastWrongAt: new Date().toLocaleString('zh-TW'),
          mastered: false
        });
      }
    }

    function submitBatchAnswer() {
      const version = document.getElementById('versionSelect').value;
      const subject = document.getElementById('subjectSelect').value;
      const parentNote = document.getElementById('parentNote').value.trim();
      const feedback = document.getElementById('feedbackBox');
      const batch = buildBatchQuestions();

      if (currentPhotos.length === 0 && !document.getElementById('questionText').value.trim()) {
        feedback.className = 'feedback wrong';
        feedback.innerHTML = '請先拍考卷／選照片，或輸入題號／重寫答案再送出。';
        return;
      }

      const items = loadMistakes();
      let passCount = 0;
      let holdCount = 0;
      const detailLines = [];

      for (const entry of batch) {
        if (!entry.correctAnswer) {
          upsertMistakeItem(items, version, subject, parentNote, entry);
          holdCount += 1;
          detailLines.push(`• ${escapeHtml(entry.question)}：未填正答，先留著不放過`);
          continue;
        }

        const isRight = entry.userAnswer.toLowerCase() === entry.correctAnswer.toLowerCase();
        if (isRight) {
          passCount += 1;
          detailLines.push(`• ${escapeHtml(entry.question)}：重寫答對（${escapeHtml(entry.userAnswer)}）→ 過關！`);
        } else {
          upsertMistakeItem(items, version, subject, parentNote, entry);
          holdCount += 1;
          detailLines.push(
            `• ${escapeHtml(entry.question)}：重寫「${escapeHtml(entry.userAnswer || '未填')}」／正答「<strong>${escapeHtml(entry.correctAnswer)}</strong>」→ 錯了不放過，已留錯題本`
          );
        }
      }

      if (!saveMistakes(items)) return;

      feedback.className = holdCount > 0 ? 'feedback wrong' : 'feedback right';
      feedback.innerHTML = `
        <strong>重寫結果：共 ${batch.length} 題，過關 ${passCount} 題、不放過 ${holdCount} 題。</strong><br>
        ${parentNote ? `錯因提醒：${escapeHtml(parentNote)}<br>` : ''}
        <div style="margin-top: 8px; font-size: 0.92rem;">${detailLines.join('<br>')}</div>
      `;
    }

    function saveBatchMistakesDirect() {
      const version = document.getElementById('versionSelect').value;
      const subject = document.getElementById('subjectSelect').value;
      const parentNote = document.getElementById('parentNote').value.trim();
      const feedback = document.getElementById('feedbackBox');
      const batch = buildBatchQuestions();

      if (currentPhotos.length === 0 && !document.getElementById('questionText').value.trim()) {
        feedback.className = 'feedback wrong';
        feedback.innerHTML = '請先拍考卷／選照片，或輸入題號再放進不放過錯題本。';
        return;
      }

      const items = loadMistakes();
      for (const entry of batch) {
        upsertMistakeItem(items, version, subject, parentNote, entry);
      }

      if (!saveMistakes(items)) return;

      feedback.className = 'feedback wrong';
      feedback.innerHTML = `<strong>已將 ${batch.length} 題放進「不放過錯題本」！</strong> 切到上方錯題本讓孩子重寫，對了才過關。`;
    }

    function markMastered(id) {
      const items = loadMistakes().map((item) =>
        item.id === id ? { ...item, mastered: !item.mastered } : item
      );
      saveMistakes(items);
    }

    function deleteMistake(id) {
      const items = loadMistakes().filter((item) => item.id !== id);
      saveMistakes(items);
    }

    function clearAllMistakes() {
      if (!confirm('確定要清空所有錯題紀錄嗎？')) return;
      saveMistakes([]);
    }

    function clearForm() {
      document.getElementById('questionText').value = '';
      document.getElementById('userAnswer').value = '';
      document.getElementById('correctAnswer').value = '';
      document.getElementById('parentNote').value = '';
      document.getElementById('cameraInput').value = '';
      document.getElementById('galleryInput').value = '';
      document.getElementById('photoFileName').textContent = '尚未加入考卷照片（可拍多張或從相簿挑多張）';
      document.getElementById('feedbackBox').className = 'feedback';
      currentPhotos = [];
      renderPhotoGrid();
    }

    function renderMistakes() {
      const allItems = loadMistakes();
      const pending = allItems.filter((x) => !x.mastered);
      document.getElementById('wrongCount').textContent = pending.length;

      const listEl = document.getElementById('mistakeList');
      if (!listEl) return;

      const visibleItems = reviewFilter === 'pending' ? pending : allItems;

      if (visibleItems.length === 0) {
        listEl.innerHTML =
          reviewFilter === 'pending'
            ? '<p class="subtitle" style="margin-top: 14px;">目前沒有卡關未過關的題目！可切到「全部紀錄」查看已過關題目，或回「拍考卷／重寫測驗」新增。</p>'
            : '<p class="subtitle" style="margin-top: 14px;">目前還沒有錯題紀錄，去「拍考卷／重寫測驗」拍下錯題吧！</p>';
        return;
      }

      listEl.innerHTML = visibleItems
        .map(
          (item) => `
          <div class="mistake-item">
            <div class="mistake-meta">
              <span class="badge ${item.mastered ? 'ok' : ''}">
                ${item.mastered ? '已過關' : `不放過・錯 ${item.wrongCount} 次`}
              </span>
              ${escapeHtml(item.version)}・${escapeHtml(item.subject)}・${escapeHtml(item.lastWrongAt)}
            </div>
            <div style="font-weight: 700; margin-bottom: 6px;">${escapeHtml(item.question)}</div>
            ${
              item.photo
                ? `<img src="${item.photo}" alt="考卷錯題照片" style="max-height: 180px; border-radius: 10px; margin-bottom: 8px; display: block;" />`
                : ''
            }
            <div style="font-size: 0.92rem; color: #334155;">
              上次作答：${escapeHtml(item.userAnswer || '未填')}｜正答：<strong>${escapeHtml(item.correctAnswer || '待對課本／習作')}</strong>｜錯因：${escapeHtml(item.parentNote)}
            </div>
            <div class="action-bar">
              <button class="btn-success" onclick="markMastered(${item.id})">
                ${item.mastered ? '重寫又錯了！拉回不放過' : '重寫答對了！准予過關'}
              </button>
              <button class="btn-secondary" onclick="deleteMistake(${item.id})">刪除</button>
            </div>
          </div>
        `
        )
        .join('');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    renderMistakes();
  </script>
</body>
</html>
