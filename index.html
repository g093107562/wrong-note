<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>錯題不放過小工具｜拍考卷列題目、重寫過關</title>
  <style>
    /* =========================================================
       樣式區（換顏色、圓角、按鈕、卡片間距，直接改這裡最快）
       ========================================================= */
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --ai: #7c3aed;
      --ai-hover: #6d28d9;
      --ai-soft: #f5f3ff;
      --ai-border: #ddd6fe;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --danger-border: #fecaca;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --success-border: #bbf7d0;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 18px;
      --shadow: 0 6px 24px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .app {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: 1.38rem;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 11px 15px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-ai {
      background: var(--ai);
      color: #fff;
    }

    .btn-ai:hover:not(:disabled) {
      background: var(--ai-hover);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary.active {
      background: var(--primary);
      color: #fff;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger-soft {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    .field-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 0.94rem;
    }

    select,
    input[type="text"],
    input[type="password"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.98rem;
      font-family: inherit;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 62px;
      resize: vertical;
    }

    .row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1.5fr;
      gap: 12px;
    }

    @media (max-width: 640px) {
      .row-3 {
        grid-template-columns: 1fr;
      }
    }

    .photo-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .photo-tip {
      margin-top: 6px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .photo-thumb-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      background: #f8fafc;
    }

    .photo-thumb-card img {
      width: 100%;
      height: 105px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .remove-photo-btn {
      margin-top: 6px;
      width: 100%;
      padding: 5px 8px;
      font-size: 0.8rem;
      border-radius: 8px;
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    /* AI 選填區塊 */
    .ai-box {
      margin-top: 12px;
      padding: 13px 15px;
      border-radius: 14px;
      background: var(--ai-soft);
      border: 1px solid var(--ai-border);
    }

    .ai-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 8px;
    }

    @media (max-width: 640px) {
      .ai-row {
        grid-template-columns: 1fr;
      }
    }

    .generated-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .q-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #f8fafc;
    }

    .q-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .q-mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.5fr;
      gap: 8px;
      margin-top: 8px;
    }

    @media (max-width: 640px) {
      .q-mini-grid {
        grid-template-columns: 1fr;
      }
    }

    .mini-choices {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .mini-choice-btn {
      padding: 6px 12px;
      font-size: 0.88rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }

    .mini-choice-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .feedback {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      display: none;
    }

    .feedback.wrong {
      display: block;
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      color: #991b1b;
    }

    .feedback.right {
      display: block;
      background: var(--success-soft);
      border: 1px solid var(--success-border);
      color: #166534;
    }

    .mistake-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      background: #fff;
    }

    .mistake-meta {
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #fee2e2;
      color: #b91c1c;
      margin-right: 6px;
    }

    .badge.ok {
      background: #dcfce7;
      color: #15803d;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    .cta-box {
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
      border: 1px solid #dbeafe;
    }

    .footer-note {
      font-size: 0.92rem;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="header-top">
        <div>
          <span class="brand-tag">錯題不放過・拍完即列題</span>
          <h1>拍考卷列題目 → 重寫對了才過關</h1>
          <p class="subtitle">免設定也能直接列出題目卡片重寫；填選 Gemini API Key 更可一鍵自動讀圖抓題目</p>
        </div>
        <select id="versionSelect" style="width: auto; min-width: 135px;">
          <option value="康軒">康軒版</option>
          <option value="翰林">翰林版</option>
          <option value="南一">南一版</option>
          <option value="其他">其他／自訂</option>
        </select>
      </div>

      <div class="mode-tabs">
        <button id="tabPractice" class="btn-secondary active" onclick="switchTab('practice')">
          1. 拍考卷列題目重寫
        </button>
        <button id="tabReview" class="btn-secondary" onclick="switchTab('review')">
          2. 不放過錯題本 (<span id="wrongCount">0</span>)
        </button>
      </div>
    </div>

    <div id="practiceSection" class="card">
      <div class="row-3">
        <div class="field-group">
          <label for="subjectSelect">科目</label>
          <select id="subjectSelect">
            <option value="數學">數學</option>
            <option value="國語">國語</option>
            <option value="自然">自然</option>
            <option value="社會">社會</option>
            <option value="英文">英文</option>
          </select>
        </div>

        <div class="field-group">
          <label for="questionCount">列出幾題</label>
          <input id="questionCount" type="number" min="1" max="20" value="3" onchange="syncQuestionCards()" />
        </div>

        <div class="field-group">
          <label>拍考卷／選照片</label>
          <div class="photo-actions">
            <button type="button" class="btn-primary" onclick="triggerCameraCapture()">
              拍考卷
            </button>
            <button type="button" class="btn-secondary" onclick="triggerGalleryPick()">
              選相簿多張
            </button>
          </div>
          <div id="photoFileName" class="photo-tip">拍完或選完照片，下方會自動列出題目卡片</div>

          <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
            class="hidden"
            onchange="handlePhotoChange(event)"
          />
          <input
            id="galleryInput"
            type="file"
            accept="image/*"
            multiple
            class="hidden"
            onchange="handlePhotoChange(event)"
          />
        </div>
      </div>

      <div id="photoGrid" class="photo-grid"></div>

      <!-- 做法 B：選填 Gemini API Key 自動讀圖抓題目 -->
      <div class="ai-box">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;">
          <strong style="color: #5b21b6; font-size: 0.94rem;">AI 讀圖幫列題目（選填，沒填也能直接用下方卡片）</strong>
          <span style="font-size: 0.8rem; color: #6d28d9;">Key 僅存於您本機瀏覽器</span>
        </div>
        <div class="ai-row">
          <input
            id="geminiApiKey"
            type="password"
            placeholder="選填：貼上 Gemini API Key（AIza...）"
            onchange="saveApiKeyLocal(this.value)"
          />
          <button id="aiExtractBtn" type="button" class="btn-ai" onclick="extractQuestionsWithGemini()">
            AI 幫列題目
          </button>
        </div>
        <div id="aiStatusTip" style="margin-top: 6px; font-size: 0.84rem; color: #5b21b6;"></div>
      </div>

      <!-- 題目卡片清單 -->
      <div id="questionCardsContainer" class="generated-list"></div>

      <div class="action-bar">
        <button class="btn-primary" onclick="judgeAllCards()">全部送出判定（對了過關／錯了不放過）</button>
        <button class="btn-danger-soft" onclick="putAllCardsIntoMistake()">整批放進「不放過錯題本」</button>
        <button class="btn-secondary" onclick="clearAllDraft()">清空重來</button>
      </div>

      <div id="feedbackBox" class="feedback"></div>
    </div>

    <div id="reviewSection" class="card hidden">
      <div class="header-top">
        <div>
          <h2 style="margin: 0; font-size: 1.15rem;">不放過錯題本</h2>
          <p class="subtitle">沒過關的會一直留在這裡，重寫答對才算過關</p>
        </div>
        <div class="action-bar" style="margin-top: 0;">
          <button id="filterPendingBtn" class="btn-secondary active" onclick="setReviewFilter('pending')">
            尚未過關
          </button>
          <button id="filterAllBtn" class="btn-secondary" onclick="setReviewFilter('all')">
            全部紀錄
          </button>
          <button class="btn-danger-soft" onclick="clearAllMistakes()">清空紀錄</button>
        </div>
      </div>

      <div id="mistakeList"></div>
    </div>

    <div class="card cta-box">
      <p class="footer-note" style="margin: 0 0 10px;">
        <strong>想要更多年級／科目版本，或每週有人幫整理錯題重寫清單？</strong>
      </p>
      <div class="action-bar" style="margin-top: 0;">
        <button class="btn-secondary" onclick="alert('歡迎留言告訴我們想加哪個年級、科目或課本版本！')">
          敲碗許願缺的版本
        </button>
        <button class="btn-success" onclick="alert('想了解每週整理錯題重寫＋解析方案，歡迎聯繫洽詢！')">
          了解每週代整理方案
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'wrong_note_ai_hybrid_v1';
    const API_KEY_STORAGE = 'wrong_note_user_gemini_key';
    let currentPhotos = [];
    let questionDrafts = [];
    let reviewFilter = 'pending';

    function initSavedKey() {
      const saved = localStorage.getItem(API_KEY_STORAGE) || '';
      document.getElementById('geminiApiKey').value = saved;
    }

    function saveApiKeyLocal(val) {
      const trimmed = (val || '').trim();
      if (trimmed) {
        localStorage.setItem(API_KEY_STORAGE, trimmed);
      } else {
        localStorage.removeItem(API_KEY_STORAGE);
      }
    }

    function loadMistakes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveMistakes(items) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        renderMistakes();
        return true;
      } catch {
        alert('瀏覽器本機儲存空間已滿，建議先刪除部分舊錯題或清空紀錄。');
        return false;
      }
    }

    function switchTab(tab) {
      const isPractice = tab === 'practice';
      document.getElementById('practiceSection').classList.toggle('hidden', !isPractice);
      document.getElementById('reviewSection').classList.toggle('hidden', isPractice);
      document.getElementById('tabPractice').classList.toggle('active', isPractice);
      document.getElementById('tabReview').classList.toggle('active', !isPractice);
      if (!isPractice) renderMistakes();
    }

    function setReviewFilter(mode) {
      reviewFilter = mode;
      document.getElementById('filterPendingBtn').classList.toggle('active', mode === 'pending');
      document.getElementById('filterAllBtn').classList.toggle('active', mode === 'all');
      renderMistakes();
    }

    function triggerCameraCapture() {
      const input = document.getElementById('cameraInput');
      input.value = '';
      input.click();
    }

    function triggerGalleryPick() {
      const input = document.getElementById('galleryInput');
      input.value = '';
      input.click();
    }

    function compressImageFile(file, maxWidth = 1000, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('讀取照片失敗'));
        reader.onload = function (e) {
          const img = new Image();
          img.onerror = () => reject(new Error('圖片解碼失敗'));
          img.onload = function () {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handlePhotoChange(event) {
      const files = Array.from(event.target.files || []);
      const tipEl = document.getElementById('photoFileName');
      if (files.length === 0) return;

      tipEl.textContent = `處理照片中（共 ${files.length} 張）...`;
      let added = 0;

      for (const file of files) {
        try {
          const dataUrl = await compressImageFile(file);
          currentPhotos.push({
            name: file.name || `考卷_${currentPhotos.length + 1}`,
            data: dataUrl
          });
          added += 1;
        } catch {
          // 單張失敗不中斷其他照片
        }
      }

      renderPhotoGrid();
      if (added > 0) {
        const countInput = document.getElementById('questionCount');
        const currentCount = parseInt(countInput.value, 10) || 1;
        if (currentPhotos.length > currentCount) {
          countInput.value = Math.min(20, currentPhotos.length);
        }
        syncQuestionCards();
        tipEl.textContent = `已加入 ${currentPhotos.length} 張照片（下方已列出卡片，也可按 AI 幫列題目）`;
      } else {
        tipEl.textContent = '照片載入失敗，請改用「選相簿多張」或用瀏覽器開啟再試一次。';
      }
    }

    function removePhoto(index) {
      currentPhotos.splice(index, 1);
      renderPhotoGrid();
      syncQuestionCards();
      document.getElementById('photoFileName').textContent =
        currentPhotos.length > 0
          ? `已加入 ${currentPhotos.length} 張照片`
          : '拍完或選完照片，下方會自動列出題目卡片';
    }

    function renderPhotoGrid() {
      const grid = document.getElementById('photoGrid');
      if (currentPhotos.length === 0) {
        grid.innerHTML = '';
        return;
      }

      grid.innerHTML = currentPhotos
        .map(
          (p, idx) => `
          <div class="photo-thumb-card">
            <img src="${p.data}" alt="考卷照片 ${idx + 1}" />
            <button type="button" class="remove-photo-btn" onclick="removePhoto(${idx})">移除第 ${idx + 1} 張</button>
          </div>
        `
        )
        .join('');
    }

    async function extractQuestionsWithGemini() {
      const apiKey = document.getElementById('geminiApiKey').value.trim();
      const statusEl = document.getElementById('aiStatusTip');
      const btn = document.getElementById('aiExtractBtn');
      const subject = document.getElementById('subjectSelect').value;

      if (!apiKey) {
        statusEl.textContent = '尚未填入 Gemini API Key（沒填也能直接使用下方題目卡片作答喔！）';
        return;
      }
      if (currentPhotos.length === 0) {
        statusEl.textContent = '請先「拍考卷」或「選相簿多張」加入照片後，再按 AI 幫列題目。';
        return;
      }

      saveApiKeyLocal(apiKey);
      btn.disabled = true;
      statusEl.textContent = 'AI 正在讀取考卷照片並整理題目清單中...';

      try {
        const imageParts = currentPhotos.slice(0, 4).map((p) => {
          const base64Data = p.data.split(',')[1];
          return {
            inline_data: {
              mime_type: 'image/jpeg',
              data: base64Data
            }
          };
        });

        const promptText = `你是一位台灣國小${subject}老師。請仔細看這幾張考卷／練習單照片，優先挑出有打叉、圈錯、塗改或作答錯誤的題目（若看不出對錯，則列出照片中的主要題目，最多 10 題）。
請嚴格只回傳純 JSON 陣列，不要任何 markdown 標記或額外文字，格式如下：
[
  {
    "title": "第X題：題目完整文字與選項（若有）",
    "correctAnswer": "正確答案（若可判斷）",
    "note": "簡短錯因或解題關鍵提醒"
  }
]`;

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [
                {
                  parts: [{ text: promptText }, ...imageParts]
                }
              ],
              generationConfig: {
                temperature: 0.2
              }
            })
          }
        );

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data?.error?.message || 'Gemini API 呼叫失敗');
        }

        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleaned = rawText.replace(/```json|```/gi, '').trim();
        const parsed = JSON.parse(cleaned);

        if (!Array.isArray(parsed) || parsed.length === 0) {
          throw new Error('AI 未辨識出題目，請確認照片文字清晰後再試。');
        }

        questionDrafts = parsed.slice(0, 20).map((item, idx) => ({
          title: item.title || `第 ${idx + 1} 題`,
          userAnswer: '',
          correctAnswer: item.correctAnswer || '',
          note: item.note || ''
        }));

        document.getElementById('questionCount').value = questionDrafts.length;
        renderQuestionCards();
